<!doctype html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087f8c">
<meta name="application-name" content="BioTrack">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/assets/icons/biotrack-192.png" type="image/png">
<link rel="apple-touch-icon" href="/static/assets/icons/biotrack-192.png">
<link rel="stylesheet" href="/static/css/global.css">
<style>
body{padding:20px}.card{padding:20px;border-radius:15px;box-shadow:0 2px 12px #ccc}
button{padding:8px 14px;border:0;border-radius:8px;background:#1976d2;color:white;cursor:pointer}
input{padding:10px;width:260px;margin:5px}
table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd}
img{width:100px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:600px){table{font-size:12px}.card{padding:10px;overflow:auto}}
</style></head>
<body>
<div class="card">
<h2>Device Management</h2>
<input id="s" placeholder="Search devices">
<div class="actions"><button onclick="location.href='/api/devices/export/excel'">Export Excel</button></div>
<table><thead><tr><th>Name</th><th>Type</th><th>Serial</th><th>QR</th><th>Action</th></tr></thead>
<tbody id="rows"></tbody></table>
</div>
<script src="/static/js/csrf.js"></script><script>
let data=[];
async function load(){
 const response=await fetch('/api/devices');
 if(!response.ok) throw new Error('Unable to load devices.');
 const result=await response.json();
 data=Array.isArray(result)?result:[];
 draw();
}
function draw(){
 const query=s.value.toLowerCase();
 const fragment=document.createDocumentFragment();
 data.filter(d=>[d.device_name,d.serial_number,d.device_type].join(' ').toLowerCase().includes(query)).forEach(d=>{
  const id=Number(d.id);
  if(!Number.isInteger(id)||id<1) return;
  const row=document.createElement('tr');
  [d.device_name,d.device_type,d.serial_number].forEach(value=>{
   const cell=document.createElement('td');
   cell.textContent=value||'-';
   row.appendChild(cell);
  });
  const qrCell=document.createElement('td');
  const qr=document.createElement('img');
  qr.src=`/api/devices/${id}/qr`;
  qr.alt=`QR code for ${d.device_name||'device'}`;
  qrCell.appendChild(qr);
  row.appendChild(qrCell);
  const actions=document.createElement('td');
  const editButton=document.createElement('button');
  editButton.type='button';
  editButton.textContent='Edit';
  editButton.addEventListener('click',()=>edit(id));
  const deleteButton=document.createElement('button');
  deleteButton.type='button';
  deleteButton.textContent='Delete';
  deleteButton.addEventListener('click',()=>del(id));
  actions.append(editButton,deleteButton);
  row.appendChild(actions);
  fragment.appendChild(row);
 });
 rows.replaceChildren(fragment);
}
s.oninput=draw;
async function del(id){await fetch('/api/devices/'+id,{method:'DELETE'});load()}
async function edit(id){
 let d=data.find(x=>x.id==id);
 let n=prompt("Device name",d.device_name);
 if(n){await fetch('/api/devices/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...d,device_name:n})});load()}
}
load().catch(error=>{
 const row=document.createElement('tr');
 const cell=document.createElement('td');
 cell.colSpan=5;
 cell.textContent=error.message;
 row.appendChild(cell);
 rows.replaceChildren(row);
});
</script><script src="/static/js/pwa.js" defer></script></body></html>
