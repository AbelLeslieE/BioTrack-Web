<!DOCTYPE html>
<html lang="en">

<head>
    
    <!-- ==========================================
         META
    =========================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07182d">
    <meta name="application-name" content="BioTrack">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/static/assets/icons/biotrack-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/assets/icons/biotrack-192.png">

    <title>BioTrack | Hospital Asset Operations</title>

    <!-- ==========================================
         GOOGLE FONT
    =========================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css?v=7.3.1">
    <!-- ==========================================
         LUCIDE ICONS
    =========================================== -->
    <script src="/static/vendor/lucide.min.js?v=1.76.0"></script>

    <!-- ==========================================
         CSS
    =========================================== -->

    <link rel="stylesheet" href="/static/dashboard_v2/dist/dashboard.bundle.css?v=20261122-1">


</head>

<body>

<div class="dashboard">



    <!-- ==========================================
        SIDEBAR
    ========================================== -->

    <aside class="sidebar" id="primary-sidebar" aria-label="Primary navigation" aria-hidden="true" inert>

        <!-- Logo -->

        <div class="sidebar-logo">

            <div class="logo-icon">

                <i data-lucide="shield-plus"></i>

            </div>

            <div class="logo-text">

                <h2>BioTrack</h2>

                <p>Hospital Asset Operations</p>

            </div>

        </div>

        <!-- Navigation -->

        <nav class="sidebar-nav" id="sidebar-nav">

            <!-- Sidebar generated dynamically -->

        </nav>

        <!-- Footer -->

        <div class="sidebar-footer">

            <div class="profile-card">

            <div class="profile-avatar" id="sidebarAvatar">
                A
            </div>

            <div>

                <strong id="sidebarRole">Loading...</strong>

                <small>Online</small>

            </div>

        </div>

            <button class="logout-btn">

                <i data-lucide="log-out"></i>

                <span>Logout</span>

            </button>

        </div>

    </aside>

    <!-- ==========================================
         MAIN CONTENT
    =========================================== -->

    <main class="main-content">

        <!-- Topbar -->

        <header class="topbar">

            <!-- Left Section -->
            <div class="topbar-left">

                <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-controls="primary-sidebar" aria-expanded="false">
                    <i data-lucide="menu"></i>
                </button>

                <div class="search-box">

                    <i data-lucide="search"></i>

                    <input
                        id="globalNavigationSearch"
                        aria-label="Search sections and tools"
                        type="text"
                        placeholder="Search sections and tools..."
                        autocomplete="off"
                    >

                </div>

            </div>

            <!-- Right Section -->
            <div class="topbar-right">

                <button class="notification-btn" type="button" aria-label="Open dashboard alerts" aria-expanded="false">

                    <i data-lucide="bell"></i>

                    <span class="notification-badge" id="notificationBadge" hidden>0</span>

                </button>

                <div class="date-time">

                    <div id="currentDate">
                        Loading...
                    </div>

                    <div id="currentTime">
                        Loading...
                    </div>

                </div>

                <button class="profile-button" type="button" aria-label="Open account menu" aria-haspopup="menu" aria-expanded="false">

                    <div class="profile-avatar" id="topAvatar">
                        A
                    </div>

                    <div class="profile-info">

                        <strong id="topUsername">Loading...</strong>

                        <small id="topRole">Loading...</small>

                    </div>

                    <i data-lucide="chevron-down"></i>

                </button>

            </div>

        </header>

        <!-- Dashboard -->

        <!-- ==========================================
            DASHBOARD MAIN
        ========================================== -->

        <!-- ==========================================
            PAGE CONTENT
        ========================================== -->

        <div id="page-content"></div>

         

        </main>

</div> <!-- END .dashboard -->




<script src="/static/vendor/chart.umd.min.js?v=4.5.1-local1"></script>
<script src="/static/vendor/html5-qrcode.min.js?v=2.3.8"></script>
<script src="/static/dashboard_v2/dist/dashboard.bundle.js?v=20261122-1"></script>


<script>
    lucide.createIcons();
</script>
<script>

document.addEventListener("DOMContentLoaded", () => {

    const role = localStorage.getItem("role") || "";
    const username = localStorage.getItem("username") || "User";

    let roleText = role;

    switch(role.toLowerCase()){

        case "admin":
        case "manager":
            roleText = "Administrator";
            break;

        case "engineer":
        case "bme":
            roleText = "Biomedical Engineer";
            break;

        case "electrical":
            roleText = "Electrical Engineer";
            break;

        case "it":
            roleText = "IT Department";
            break;

        case "user":
            roleText = "Department User";
            break;

        case "wardboy":
            roleText = "Ward Boy";
            break;

        case "centralstore":
            roleText = "Central Store";
            break;

        case "business":
            roleText = "Business Office";
            break;
    }

    document.getElementById("topUsername").textContent = username;

    document.getElementById("topRole").textContent = roleText;

    document.getElementById("sidebarRole").textContent = roleText;

    document.getElementById("topAvatar").textContent =
        username.charAt(0).toUpperCase();

    document.getElementById("sidebarAvatar").textContent =
        username.charAt(0).toUpperCase();

});

</script>
    <script src="/static/js/pwa.js" defer></script>
</body>
</html>
